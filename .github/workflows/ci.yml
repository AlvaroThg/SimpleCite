name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Format & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint (ESLint)
        run: pnpm lint:root

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Build all packages
        run: pnpm build

      - name: Unit tests (Jest)
        run: pnpm --filter api test

  db-validate:
    name: Validate Prisma schema & migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simplecite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/simplecite_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/simplecite_test
      JWT_SECRET: ci-secret-of-at-least-32-characters-long-xx
      PATIENT_JWT_SECRET: ci-patient-secret-of-at-least-32-chars-xx
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @simplecite/database exec prisma validate

      - name: Apply migrations (deploy)
        run: pnpm db:migrate:deploy

      - name: Run seed (smoke test)
        run: pnpm db:seed

  # ─── Build + push de imágenes Docker (solo en push a main) ───────────
  docker-images:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [quality, db-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # para publicar en GHCR
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
            context: .
          # La web también se construye en CI: valida su Dockerfile y deja la
          # imagen lista en GHCR. Las NEXT_PUBLIC_* reales se inyectan en el
          # build del servidor de deploy (Dokploy), no aquí.
          - image: web
            dockerfile: apps/web/Dockerfile
            context: .
          # (whatsapp-instance se construye solo en develop: el bot está
          # apagado en main con ENABLE_WHATSAPP=false.)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags semver + sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
