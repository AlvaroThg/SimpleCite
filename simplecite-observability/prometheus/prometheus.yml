# =============================================================================
# SimpleCite Observability — Prometheus
# =============================================================================
# La API de SimpleCite NO expone /metrics (no está instrumentada), así que aquí
# solo hay self-monitoring del stack (Prometheus + Loki + Promtail), que sí
# exponen métricas. El observability principal de SimpleCite son los LOGS (Loki).
#
# Si más adelante se instrumenta la API (prom-client / @willsoto/nestjs-prometheus)
# y expone /metrics, añade un job apuntando a `simplecite-api:3001`.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: simplecite-prod

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          service: prometheus

  - job_name: loki
    static_configs:
      - targets: [loki:3100]
        labels:
          service: loki

  - job_name: promtail
    static_configs:
      - targets: [promtail:9080]
        labels:
          service: promtail
