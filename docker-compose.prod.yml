# =====================================================================
# docker-compose.prod.yml — SimpleCite en Dokploy (sin Traefik propio)
# =====================================================================
# Dokploy provee Traefik + TLS + routing → este compose NO incluye traefik.
# Servicios: db (Postgres) · api (NestJS) · web (Next.js). Los wa-{slug} los
# crea el API vía el socket Docker. Storage en Cloudflare R2 (externo).
#
# En Dokploy:
#   1. Crea un servicio tipo "Compose" apuntando a este archivo.
#   2. Pega el contenido de .env.production en el Environment del Compose.
#   3. En "Domains" agrega:
#        - host api.${APP_DOMAIN}  → service `api`, container port 3001
#        - host ${APP_DOMAIN}      → service `web`, container port 3000
#      Dokploy inyecta los labels de Traefik y emite el certificado.
# No se publican puertos al host: Traefik enruta por la dokploy-network.
# =====================================================================

networks:
  # Red privada del stack (API ↔ db ↔ wa-{slug}); no expuesta.
  simplecite-internal:
    name: simplecite-internal
    driver: bridge
  # Red de Dokploy: su Traefik enruta hacia api/web por aquí.
  dokploy-network:
    external: true

volumes:
  simplecite-pgdata:
    name: simplecite-pgdata

services:
  # ─── PostgreSQL (DB interna) ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: simplecite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplecite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-simplecite}
    networks:
      - simplecite-internal
    volumes:
      - simplecite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-simplecite} -d ${POSTGRES_DB:-simplecite}'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── API NestJS ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: simplecite-api:prod
    container_name: simplecite-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      - simplecite-internal
      - dokploy-network
    # Socket Docker para que el InstanceManager cree contenedores Baileys.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ─── Web Next.js ───────────────────────────────────────────────────
  # NEXT_PUBLIC_* se inlinean en build (navegador); INTERNAL_API_URL es runtime
  # (SSR por la red interna). Ver apps/web/src/lib/api-base.ts.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_PAYPAL_PLAN_ID: ${NEXT_PUBLIC_PAYPAL_PLAN_ID}
    image: simplecite-web:prod
    container_name: simplecite-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://simplecite-api:3001
    networks:
      - simplecite-internal
      - dokploy-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
