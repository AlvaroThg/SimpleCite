# =====================================================================
# docker-compose.prod.yml — SimpleCite en VPS (Hetzner/DigitalOcean)
# =====================================================================
# Servicios: traefik (reverse proxy + TLS), api (NestJS), y los contenedores
# Baileys que el orquestador crea dinámicamente (no se declaran aquí).
#
# El frontend (Next.js) se despliega en Vercel — NO va en este compose.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Requisitos en el VPS: ver docs/deploy-vps.md
# =====================================================================

networks:
  simplecite-internal:
    name: simplecite-internal
    driver: bridge
  web:
    name: web
    driver: bridge

volumes:
  traefik-letsencrypt:

services:
  # ─── Reverse proxy + TLS automático (Let's Encrypt) ────────────────
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirección global HTTP→HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt (TLS-ALPN). Cloudflare debe ir en modo "Full (strict)".
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - web

  # ─── API NestJS ────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GH_REPO}/api:${IMAGE_TAG:-latest}
    container_name: simplecite-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      - web
      - simplecite-internal
    # Socket Docker para que el InstanceManager cree contenedores Baileys.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      - traefik.enable=true
      # API en api.simplecite.com.bo
      - traefik.http.routers.api.rule=Host(`api.${APP_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=3001
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
