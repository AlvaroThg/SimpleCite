# =====================================================================
# docker-compose.prod.yml — SimpleCite en Dokploy
# =====================================================================
# Dokploy gestiona TLS + routing automáticamente (vía los Domains de la UI).
# Servicios: db (Postgres) · api (NestJS) · web (Next.js). Los wa-{slug} los
# crea el API vía el socket Docker. Storage en Cloudflare R2 (externo).
#
# En Dokploy:
#   1. Crea un servicio tipo "Compose" apuntando a este archivo.
#   2. Pega el contenido de .env.production en el Environment del Compose.
#   3. En "Domains" agrega:
#        - host api.${APP_DOMAIN}  → service `api`, container port 3001
#        - host ${APP_DOMAIN}      → service `web`, container port 3000
#      Dokploy se encarga del routing y el certificado.
# No se publican puertos al host: Dokploy enruta por la dokploy-network.
# =====================================================================

networks:
  # Red privada del stack (API ↔ db ↔ wa-{slug}); no expuesta.
  simplecite-internal:
    name: simplecite-internal
    driver: bridge
  # Red de Dokploy: enruta hacia api/web por aquí.
  dokploy-network:
    external: true

volumes:
  simplecite-pgdata:
    name: simplecite-pgdata
  # ── Observabilidad ──
  loki-data:
  prometheus-data:
  grafana-data:
  promtail-positions:

services:
  # ─── PostgreSQL (DB interna) ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: simplecite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplecite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-simplecite}
    networks:
      - simplecite-internal
    volumes:
      - simplecite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-simplecite} -d ${POSTGRES_DB:-simplecite}'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── API NestJS ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: simplecite-api:prod
    container_name: simplecite-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Arranque: bootstrap de funciones RLS + migraciones (idempotentes) y luego
    # el API. Garantiza que una DB nueva quede migrada sin pasos manuales.
    command:
      - sh
      - -c
      - 'cd /app/packages/database && ./node_modules/.bin/prisma db execute --schema prisma/schema.prisma --file scripts/bootstrap-rls-functions.sql && ./node_modules/.bin/prisma migrate deploy && cd /app/apps/api && exec node dist/main.js'
    # Sin env_file: las variables vienen del Environment de Dokploy (interpolación).
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3001}
      APP_DOMAIN: ${APP_DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-12h}
      PATIENT_JWT_SECRET: ${PATIENT_JWT_SECRET}
      PATIENT_SESSION_TTL: ${PATIENT_SESSION_TTL:-30m}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      TENTATIVE_APPOINTMENT_TTL_MINUTES: ${TENTATIVE_APPOINTMENT_TTL_MINUTES:-15}
      # Booking sin bot en main: OTP desactivado (Turnstile + rate limit protegen).
      PUBLIC_BOOKING_REQUIRE_OTP: ${PUBLIC_BOOKING_REQUIRE_OTP:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      WA_DOCKER_NETWORK: ${WA_DOCKER_NETWORK:-simplecite-internal}
      WA_CALLBACK_URL: ${WA_CALLBACK_URL}
      WA_INTERNAL_SECRET: ${WA_INTERNAL_SECRET}
      WA_INSTANCE_IMAGE: ${WA_INSTANCE_IMAGE:-simplecite-wa-instance:latest}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      RLS_ENFORCED: ${RLS_ENFORCED:-false}
    networks:
      - simplecite-internal
      - dokploy-network
    # Dokploy genera los routers (pestaña Domains). Solo añadimos los 2 hints
    # que sus labels NO traen y que un contenedor multi-red necesita: exponerse
    # a Traefik y fijar la red por la que Traefik alcanza el backend.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
    # Socket Docker para que el InstanceManager cree contenedores Baileys.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/health || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ─── Web Next.js ───────────────────────────────────────────────────
  # NEXT_PUBLIC_* se inlinean en build (navegador); INTERNAL_API_URL es runtime
  # (SSR por la red interna). Ver apps/web/src/lib/api-base.ts.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: simplecite-web:prod
    container_name: simplecite-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://simplecite-api:3001
    networks:
      - simplecite-internal
      - dokploy-network
    # Dokploy genera los routers (Domains). Solo los 2 hints que faltan.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ═══════════════════════════════════════════════════════════════════
  # Observabilidad (Loki · Promtail · Prometheus · Grafana)
  # Configs en ./simplecite-observability/*. Solo Grafana se expone (Dokploy
  # Domains → service grafana, port 3000). El resto es interno.
  # ═══════════════════════════════════════════════════════════════════

  # ─── Loki (almacén de logs) ────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.0
    container_name: simplecite-loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./simplecite-observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - simplecite-internal
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Promtail (recolector de logs de Docker) ───────────────────────
  promtail:
    image: grafana/promtail:3.4.0
    container_name: simplecite-promtail
    restart: unless-stopped
    command: ['-config.file=/etc/promtail/config.yml']
    depends_on:
      - loki
    volumes:
      - ./simplecite-observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/var/lib/promtail
    networks:
      - simplecite-internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Prometheus (métricas del stack; la API no expone /metrics) ────
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: simplecite-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./simplecite-observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./simplecite-observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - simplecite-internal
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Grafana (UI; expuesta vía Dokploy/Traefik) ────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    container_name: simplecite-grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
      # Sirve detrás del proxy de Dokploy en un subpath/host dedicado.
      GF_SERVER_SERVE_FROM_SUB_PATH: 'false'
    volumes:
      - ./simplecite-observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./simplecite-observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./simplecite-observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/definitions:ro
      - grafana-data:/var/lib/grafana
    networks:
      - simplecite-internal
      - dokploy-network
    # Routing/TLS por Dokploy (Domains → service grafana, port 3000).
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
