# =====================================================================
# docker-compose.prod.yml — SimpleCite self-hosted (VPS con Docker + Traefik)
# =====================================================================
# Camino MANUAL (alternativa a Dokploy, que es lo recomendado —
# ver docs/deploy-dokploy.md). Levanta el stack completo:
#   traefik (reverse proxy + TLS) · db (Postgres) · api (NestJS) · web (Next.js)
# Los contenedores Baileys wa-{slug} los crea el API dinámicamente vía el socket.
# Storage en Cloudflare R2 (externo). No hay Supabase ni Vercel.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Requisitos en el VPS: ver docs/deploy-vps.md
# =====================================================================

networks:
  simplecite-internal:
    name: simplecite-internal
    driver: bridge
  web:
    name: web
    driver: bridge

volumes:
  traefik-letsencrypt:
  simplecite-pgdata:
    name: simplecite-pgdata

services:
  # ─── Reverse proxy + TLS automático (Let's Encrypt) ────────────────
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirección global HTTP→HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt (TLS-ALPN). Cloudflare en "Full (strict)" o DNS-only.
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - web

  # ─── PostgreSQL (DB interna) ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: simplecite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplecite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-simplecite}
    networks:
      - simplecite-internal
    volumes:
      - simplecite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-simplecite} -d ${POSTGRES_DB:-simplecite}'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── API NestJS ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: simplecite-api:prod
    container_name: simplecite-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      - web
      - simplecite-internal
    # Socket Docker para que el InstanceManager cree contenedores Baileys.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.api.rule=Host(`api.${APP_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=3001
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ─── Web Next.js ───────────────────────────────────────────────────
  # NEXT_PUBLIC_* se inlinean en build (navegador); INTERNAL_API_URL es runtime
  # (SSR por la red interna). Ver apps/web/src/lib/api-base.ts.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_PAYPAL_PLAN_ID: ${NEXT_PUBLIC_PAYPAL_PLAN_ID}
    image: simplecite-web:prod
    container_name: simplecite-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://simplecite-api:3001
    networks:
      - web
      - simplecite-internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=3000
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
