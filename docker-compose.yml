# =====================================================================
# docker-compose.yml — SimpleCite backend (NestJS) para dev y VPS
# =====================================================================
# - DB: servicio `db` (Postgres) dentro de la red interna; el API la alcanza
#   por el hostname `simplecite-db`. Para usar una DB externa, comenta el
#   servicio `db` y apunta DATABASE_URL al host externo.
# - env_file apunta a .env.development en local; en VPS se sustituye por
#   .env.production sin tocar el resto del archivo.
# - Docker socket montado para que el InstanceManagerService pueda crear
#   contenedores Baileys dinámicamente (uno por tenant).
# =====================================================================

networks:
  # Red interna compartida entre el API y los contenedores Baileys.
  # El API se comunica con wa-{slug} via container name en esta red.
  simplecite-internal:
    driver: bridge
    name: simplecite-internal

volumes:
  # Datos de Postgres — persisten entre reinicios del contenedor.
  # `name` explícito (sin prefijo de proyecto) para reusar el volumen ya creado.
  simplecite-pgdata:
    name: simplecite-pgdata

services:
  # ─── PostgreSQL — DB interna en la red simplecite-internal ──────────
  # El API la alcanza por `simplecite-db:5432`. Credenciales por defecto para
  # local; sobrescribibles vía variables de entorno o el .env del compose.
  # DATABASE_URL/DIRECT_URL deben coincidir, p.ej:
  #   postgresql://simplecite:devpass@simplecite-db:5432/simplecite?schema=public
  db:
    image: postgres:16-alpine
    container_name: simplecite-db
    restart: unless-stopped

    networks:
      - simplecite-internal

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplecite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-simplecite}

    # Publicado al host solo para herramientas locales (prisma studio, psql).
    # En un VPS quita este mapping para no exponer la DB fuera de la red.
    ports:
      - '${DB_PORT:-5432}:5432'

    volumes:
      - simplecite-pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-simplecite} -d ${POSTGRES_DB:-simplecite}'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_VERSION: 20-alpine
        PNPM_VERSION: 10.33.2
        TURBO_VERSION: 2.5.4
    image: simplecite-api:dev
    container_name: simplecite-api
    restart: unless-stopped

    # Espera a que Postgres esté healthy antes de arrancar.
    depends_on:
      db:
        condition: service_healthy

    networks:
      - simplecite-internal

    # Mapping host:contenedor
    ports:
      - '${API_PORT:-3001}:3001'

    # Docker socket — necesario para que InstanceManagerService cree contenedores.
    # SEGURIDAD: solo montar en entornos controlados (VPS con firewall).
    # En Windows con Docker Desktop usar: //./pipe/docker_engine://./pipe/docker_engine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    # El container necesita correr como root para poder usar el socket Docker.
    # En producción (VPS Linux) lo correcto es agregar el user al grupo docker:
    #   groupadd -g <HOST_DOCKER_GID> docker && usermod -aG docker node
    # Para dev en Docker Desktop simplemente usamos root (aceptable en entorno local).
    user: root

    # Permite a los contenedores Baileys hacer POST al API usando el nombre
    # `host.docker.internal`. En Linux, add-host es necesario (Docker Desktop
    # lo resuelve automáticamente en Mac/Windows).
    extra_hosts:
      - 'host.docker.internal:host-gateway'

    env_file:
      - .env.development

    environment:
      NODE_ENV: development

    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Web (Next.js) ──────────────────────────────────────────────────
  # Doble base de API por el split SSR/navegador (ver lib/api-base.ts):
  #   - build  NEXT_PUBLIC_API_URL → la usa el NAVEGADOR (se inlinea en build).
  #     En local DEBE ser http://localhost:3001 (lo que alcanza el host).
  #   - runtime INTERNAL_API_URL  → la usa el SSR dentro del contenedor:
  #     http://simplecite-api:3001 (red interna).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_VERSION: 20-alpine
        PNPM_VERSION: 10.33.2
        TURBO_VERSION: 2.5.4
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    image: simplecite-web:dev
    container_name: simplecite-web
    restart: unless-stopped

    depends_on:
      - api

    networks:
      - simplecite-internal

    ports:
      - '${WEB_PORT:-3000}:3000'

    environment:
      NODE_ENV: production
      # SSR → API por la red interna (no sale al host).
      INTERNAL_API_URL: http://simplecite-api:3001

    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
